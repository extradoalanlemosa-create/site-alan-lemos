<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Solicitações · demonstração com dados fictícios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'Manrope','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --ink:#10111A;--ink-2:#3B3D4A;--muted:#62667A;--faint:#9A9CAA;
  --bg:#F7F6FA;--surface:#FFFFFF;--line:#DDDDE6;--line-soft:#ECEBF2;--pill:#EEEDF5;--hover:#F3F2F8;
  --accent:#FF6028;--accent-strong:#D9480F;--accent-tint:#FDEBE4;
  --red-bg:#FEF2F2;--red-line:#F7D0D0;--red-ink:#C2262B;
  --amber-bg:#FFFBEB;--amber-line:#F1E0AE;--amber-ink:#8A5106;
  --green-bg:#ECFDF5;--green-line:#BFE8D7;--green-ink:#047857;
  --blue-ink:#1c5cab;--blue-bg:#E7F0FC;--violet-ink:#5B45C9;--violet-bg:#EFECFC;
  --shadow:0 1px 2px rgba(16,17,26,.08);--scrim:rgba(16,17,26,.45);
}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.page{max-width:1400px;margin:0 auto;padding:18px 22px 36px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:21px;font-weight:800;letter-spacing:.01em;line-height:1.15}
.top p{font-size:12.5px;color:var(--muted)}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.upd{font-size:12px;color:var(--muted)}
.seg{display:inline-flex;background:var(--pill);border-radius:6px;padding:3px;gap:1px}
.seg button{padding:4px 10px;border-radius:4px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:13px;background:#fff;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn-a{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:600}
.btn-a:hover{background:var(--accent-strong)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.counts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-bottom:10px}
.cnt{background:#fff;border:1px solid var(--line);border-radius:6px;padding:9px 12px;display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left}
.cnt:hover{border-color:var(--faint)}
.cnt[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cnt span{font-size:12px;color:var(--ink-2)}
.cnt b{font-size:19px;font-weight:800}
.c-blue{color:#2a78d6}.c-amber{color:#B7791F}.c-violet{color:#6250d6}.c-red{color:var(--red-ink)}.c-slate{color:#475569}
.bar{background:#fff;border:1px solid var(--line);border-radius:6px;padding:10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.bar input{flex:1 1 280px;min-width:0;height:34px;border:1px solid var(--line);border-radius:6px;padding:0 10px;background:var(--bg)}
.bar select{height:34px;border:1px solid var(--line);border-radius:6px;padding:0 8px;background:#fff}
.bar .meta{font-size:12.5px;color:var(--ink-2)}
.lnk{color:var(--accent-strong);font-size:12.5px}
.lnk:hover{text-decoration:underline}
.sync{font-size:12px;color:var(--muted);margin:4px 2px 10px}
.tw{background:#fff;border:1px solid var(--line);border-radius:6px;overflow:auto;max-height:calc(100vh - 290px);min-height:320px}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th{position:sticky;top:0;z-index:2;background:var(--bg);font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th button{font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
td{padding:10px 12px;border-bottom:1px solid var(--line-soft);vertical-align:top;background:#fff}
tr.cl{cursor:pointer}
tr.cl:hover td{background:var(--hover)}
.stk{position:sticky;left:0;z-index:1}
th.stk{z-index:3}
.c-sol{min-width:240px;max-width:320px;border-right:1px solid var(--line)}
.num{font-weight:700;white-space:nowrap}
.sub{display:block;font-size:11.5px;color:var(--muted)}
.pl{display:inline-block;font-size:11.5px;border-radius:4px;padding:1px 7px;white-space:nowrap;background:var(--pill);color:var(--ink-2)}
.p-urg{background:#F3E8FF;color:#7E22CE}.p-alta{background:var(--accent-tint);color:var(--accent-strong)}.p-media{background:#EEF2F7;color:#475569}.p-baixa{background:var(--pill);color:var(--muted)}
.s-late{background:var(--red-bg);color:var(--red-ink)}.s-ok{background:var(--green-bg);color:var(--green-ink)}.s-pause{background:var(--amber-bg);color:var(--amber-ink)}.s-none{background:var(--pill);color:var(--muted)}
.warn{color:#B7791F}
.jira{font-size:11.5px;background:var(--blue-bg);color:var(--blue-ink);border-radius:4px;padding:1px 6px;white-space:nowrap}
.foot{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 4px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap}
.foot .pg{display:flex;gap:6px;align-items:center}

.kb{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:10px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory}
.col{background:#fff;border:1px solid var(--line);border-radius:8px;display:flex;flex-direction:column;min-height:420px;max-height:calc(100vh - 260px);scroll-snap-align:start}
.col.over{border-color:var(--accent);background:var(--accent-tint)}
.col-h{padding:10px 12px;border-bottom:1px solid var(--line-soft)}
.col-h .t{display:flex;justify-content:space-between;align-items:center;font-size:12px;font-weight:700;letter-spacing:.04em;text-transform:uppercase}
.col-h .t span{font-size:11px;background:var(--pill);border-radius:4px;padding:0 6px;font-weight:600}
.col-h p{font-size:11.5px;color:var(--muted);margin-top:2px}
.col-b{padding:8px;overflow-y:auto;display:flex;flex-direction:column;gap:8px}
.col.pend{border-color:#F3D9A4}.col.pend .col-h{background:var(--amber-bg)}
.kc{border:1px solid var(--line);border-radius:6px;padding:9px 10px;background:#fff;text-align:left;cursor:grab;display:block;width:100%}
.kc:hover{border-color:var(--faint)}
.kc.drag{opacity:.4}
.kc .h{display:flex;justify-content:space-between;align-items:center;gap:6px;margin-bottom:4px;font-size:11.5px;color:var(--muted)}
.kc .tt{font-size:12.5px;font-weight:600;line-height:1.35;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.kc .f{font-size:11.5px;color:var(--muted);margin-top:5px}

.ov{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}.ov.on{display:block}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(1020px,100vw);background:#fff;z-index:50;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.sheet.on{transform:none}
.sh-h{padding:12px 16px;border-bottom:1px solid var(--line)}
.sh-h .r1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sh-h .r1 .id{font-size:17px;font-weight:800}
.sh-h select{height:28px;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12.5px;background:#fff}
.sh-h .tt{font-size:14px;font-weight:700;margin-top:4px}
.sh-h .meta{font-size:12px;color:var(--muted);margin-top:2px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.x{margin-left:auto;font-size:22px;line-height:1;padding:2px 8px;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--hover)}
.sh-b{flex:1;display:grid;grid-template-columns:1fr 300px;min-height:0}
.tl-w{display:flex;flex-direction:column;min-height:0;border-right:1px solid var(--line)}
.tl{flex:1;overflow-y:auto;padding:14px 16px;display:flex;flex-direction:column;gap:10px;background:var(--bg)}
.msg{border:1px solid var(--line);border-radius:8px;background:#fff;padding:10px 12px;font-size:13px;max-width:92%}
.msg.int{background:#FFFBEA;border-color:#F0E2A6;align-self:flex-end}
.msg.out{align-self:flex-end;background:#F5F9FF;border-color:#D5E3F7}
.msg.sys{align-self:center;background:none;border:0;color:var(--muted);font-size:12px;padding:2px}
.msg .mh{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:11.5px;margin-bottom:4px}
.msg .mh b{font-size:12.5px}
.msg .mh .dt{margin-left:auto;color:var(--faint)}
.tg{font-size:10px;font-weight:700;letter-spacing:.04em;border-radius:3px;padding:0 5px;text-transform:uppercase}
.tg.cc{background:var(--blue-bg);color:var(--blue-ink)}.tg.in{background:#FEF3C7;color:#92400E}.tg.jr{background:var(--violet-bg);color:var(--violet-ink)}.tg.ct{background:var(--green-bg);color:var(--green-ink)}
.cmp{border-top:1px solid var(--line);padding:10px 12px;background:#fff}
.cmp .tabs{display:flex;gap:4px;margin-bottom:8px}
.cmp .tabs button{font-size:12.5px;padding:5px 10px;border-radius:6px;border:1px solid var(--line)}
.cmp .tabs button[aria-pressed="true"]{background:var(--accent-tint);border-color:#F6C9B5;color:var(--accent-strong);font-weight:600}
.cmp textarea{width:100%;min-height:66px;border:1px solid var(--line);border-radius:6px;padding:8px 10px;resize:vertical}
.cmp .row{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--muted)}
.side{overflow-y:auto}
.acc{border-bottom:1px solid var(--line-soft);padding:12px 14px}
.acc h4{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;margin-bottom:8px;display:flex;justify-content:space-between}
.acc p,.acc li{font-size:12.5px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;background:var(--pill);border-radius:4px;padding:2px 6px;margin:0 4px 4px 0;word-break:break-all}
.chip button{color:var(--muted);font-size:13px;line-height:1}
.acc select{width:100%;height:30px;border:1px solid var(--line);border-radius:6px;padding:0 6px;font-size:12.5px;background:#fff;margin-top:6px}
.jc{border:1px solid var(--line);border-radius:6px;padding:8px;margin-top:6px}
.jc .k{font-weight:700;font-size:12.5px}
.jc .tr{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.jc .tr button{font-size:11px;border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.jc .tr button:hover{background:var(--hover)}
.note{font-size:11.5px;color:var(--muted);margin-top:6px}

dialog{margin:auto;border:0;border-radius:10px;padding:0;width:min(560px,calc(100vw - 24px));max-height:calc(100vh - 40px);font-family:var(--font);color:var(--ink)}
dialog::backdrop{background:var(--scrim)}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.dh h2{font-size:16px;font-weight:700}
.db{padding:14px 18px;display:flex;flex-direction:column;gap:10px}
.db label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted)}
.db input,.db select,.db textarea{border:1px solid var(--line);border-radius:6px;padding:7px 9px;font-size:13px;color:var(--ink);background:#fff}
.db .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.df{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;font-size:13px;padding:9px 14px;border-radius:6px;z-index:80;opacity:0;transition:opacity .15s;pointer-events:none;max-width:calc(100vw - 32px)}
.toast.on{opacity:1}
@media (max-width:1100px){.counts{grid-template-columns:repeat(3,1fr)}}
@media (max-width:820px){.sh-b{display:block;overflow-y:auto}.tl-w{display:block;border-right:0}.tl{overflow:visible}.side{overflow:visible;border-top:1px solid var(--line)}}
@media (max-width:640px){
  .page{padding:14px 12px 30px}
  .counts{grid-template-columns:repeat(2,1fr)}
  .acts .upd{display:none}
  .kb{grid-template-columns:repeat(5,82vw)}
  .tw{max-height:none}
  .db .two{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
</style>
</head>
<body>
<div class="page">
  <div class="top">
    <div><h1>SOLICITAÇÕES</h1><p>Todos os clientes e todos os status, em um só lugar. Demonstração com dados fictícios.</p></div>
    <div class="acts">
      <span class="upd" id="upd"></span>
      <div class="seg" role="group" aria-label="Visão" id="visao"><button data-v="cs" aria-pressed="true">CS</button><button data-v="fin" aria-pressed="false">Financeiro</button></div>
      <button class="btn btn-a" id="novo">+ Novo chamado</button>
      <button class="btn" id="atualiza">Atualizar</button>
      <div class="seg" role="group" aria-label="Modo de exibição" id="modo"><button data-m="lista" aria-pressed="true">Lista</button><button data-m="kanban" aria-pressed="false">Kanban</button></div>
    </div>
  </div>
  <div class="counts" id="counts"></div>
  <div class="bar">
    <input type="search" id="busca" placeholder="Buscar por título, empresa, solicitante, nº do chamado, Jira…" aria-label="Buscar">
    <select id="fstatus" aria-label="Filtro de status"><option value="andamento">Em andamento (sem resolvidos)</option><option value="todos">Todos os status</option><option value="novo">Novo</option><option value="aberto">Aberto</option><option value="pendente">Pendente</option><option value="em_espera">Em espera</option><option value="resolvido">Resolvido</option></select>
    <span class="meta" id="meta"></span>
  </div>
  <p class="sync" id="sync"></p>
  <div id="view"></div>
</div>

<div class="ov" id="ov"></div>
<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="Chamado" aria-hidden="true"></aside>

<dialog id="dlgNovo" aria-labelledby="dn-t">
  <form method="dialog" id="formNovo">
    <div class="dh"><h2 id="dn-t">Novo chamado</h2><button class="x" value="cancel" aria-label="Fechar">×</button></div>
    <div class="db">
      <div class="two"><label>E-mail do cliente<input type="email" name="email" required value="contato@alfa-exemplo.com.br"></label><label>Nome<input name="nome" value="Marina Teixeira"></label></div>
      <label>Assunto<input name="assunto" required value="Relatório semanal não carrega"></label>
      <label>Descrição (vira nota interna; nada é enviado ao cliente)<textarea name="texto" rows="3">Cliente ligou dizendo que o relatório semanal fica carregando desde ontem.</textarea></label>
      <div class="two"><label>Empresa<select name="empresa" id="nEmp"></select></label><label>Etiqueta<select name="tag" id="nTag"></select></label></div>
    </div>
    <div class="df"><button class="btn" value="cancel">Cancelar</button><button class="btn btn-a" value="ok" id="nOk">Criar chamado</button></div>
  </form>
</dialog>
<dialog id="dlgConf" aria-labelledby="dc-t">
  <div class="dh"><h2 id="dc-t">Marcar como resolvido?</h2></div>
  <div class="db"><p id="dc-p" style="font-size:13.5px;color:var(--ink-2)"></p></div>
  <div class="df"><button class="btn" id="dcNo">Cancelar</button><button class="btn btn-a" id="dcOk">Resolver</button></div>
</dialog>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";
/* ========== Datas, horário de Brasília e dias úteis ========== */
const H=3600e3,D=24*H,OFF=3*H,NOW0=Date.now();
const FER=new Set(["2025-12-25","2026-01-01","2026-04-03","2026-04-21","2026-05-01","2026-06-04","2026-09-07","2026-10-12","2026-11-02","2026-11-15","2026-11-20","2026-12-25"]);
const bp=ms=>{const d=new Date(ms-OFF);return{y:d.getUTCFullYear(),m:d.getUTCMonth(),d:d.getUTCDate(),h:d.getUTCHours()}};
const iso=(y,m,d)=>new Date(Date.UTC(y,m,d)).toISOString().slice(0,10);
const util=(y,m,d)=>{const w=new Date(Date.UTC(y,m,d)).getUTCDay();return w>=1&&w<=5&&!FER.has(iso(y,m,d))};
function diaJan(c,h0,h1){const x=new Date(c);const y=x.getUTCFullYear(),m=x.getUTCMonth(),d=x.getUTCDate();return{ok:util(y,m,d),a:Date.UTC(y,m,d,h0)+OFF,b:Date.UTC(y,m,d,h1)+OFF}}
function uteisEntre(a,b,h0,h1){if(!(b>a))return 0;let t=0;const p=bp(a);let c=Date.UTC(p.y,p.m,p.d);for(let i=0;i<500;i++){const j=diaJan(c,h0,h1);if(j.a>b)break;if(j.ok){const s=Math.max(a,j.a),e=Math.min(b,j.b);if(e>s)t+=e-s}c+=D}return t}
function somaUteis(t,ms,h0,h1){let l=ms;const p=bp(t);let c=Date.UTC(p.y,p.m,p.d);for(let i=0;i<500;i++){const j=diaJan(c,h0,h1);if(j.ok){const s=Math.max(t,j.a);if(j.b>s){if(j.b-s>=l)return s+l;l-=j.b-s}}c+=D}return t+ms}
function tiraUteis(t,ms,h0,h1){let l=ms;const p=bp(t);let c=Date.UTC(p.y,p.m,p.d);for(let i=0;i<500;i++){const j=diaJan(c,h0,h1);if(j.ok){const e=Math.min(t,j.b);if(e>j.a){if(e-j.a>=l)return e-l;l-=e-j.a}}c-=D}return t-ms}
const SLA_H0=0,SLA_H1=24, CM_H0=8, CM_H1=18; // SLA: dia útil de 24 h; 1ª resposta: horário comercial

/* ========== Catálogo de etiquetas (regras de SLA) ========== */
const TAGS=[
 ["nao-consigo-medir_medicao_problema_n2","Alta",2,"Bug","Não consegue registrar medição"],
 ["relatorio-nao-abre_planejamento_problema_n2","Urgente",1,"Bug","Relatório da obra não abre"],
 ["erro-ao-salvar_planejamento_problema_n2","Alta",2,"Bug","Erro ao salvar planejamento"],
 ["dados-divergentes_medicao_problema_n2","Alta",3,"Bug","Dados divergentes entre telas"],
 ["nao-consigo-acessar_qualidade_problema_n2","Urgente",1,"Bug","Usuário sem acesso"],
 ["incluir-usuario_planejamento_solicitação_n2","Média",5,"Solicitação","Cadastro de novo usuário"],
 ["quero-uma-melhoria_qualidade_solicitação_n2","Média",10,"Solicitação","Pedido de melhoria"],
 ["importar-cronograma_planejamento_solicitação_n2","Média",3,"Solicitação","Importação de cronograma"],
 ["backup-da-obra_medicao_solicitação_n2","Baixa",5,"Solicitação","Backup de dados da obra"],
 ["como-gerar-relatorio_planejamento_dúvida_n1","Baixa",null,null,"Dúvida de uso"],
 ["etiqueta-a-definir_planejamento_problema_n2","Média",3,"Bug","Provisória: reclassificar"],
 ["segunda-via-boleto_financeiro_solicitação_n2","Média",2,"Solicitação","Segunda via de boleto"],
 ["nota-fiscal_financeiro_solicitação_n2","Média",3,"Solicitação","Nota fiscal"],
 ["cobranca-duplicada_financeiro_problema_n2","Alta",1,"Bug","Cobrança em duplicidade"]];
const REGRA=Object.fromEntries(TAGS.map(t=>[t[0],{prio:t[1],sla:t[2],classe:t[3],sig:t[4]}]));
const PRIO_ORD={Urgente:0,Alta:1,"Média":2,Baixa:3};
const PRODUTO={planejamento:"Planejamento",medicao:"Medição",qualidade:"Qualidade",financeiro:"Financeiro"};
const MOT_LBL={"nao-consigo-medir":"Não consigo medir","relatorio-nao-abre":"Relatório não abre","erro-ao-salvar":"Erro ao salvar","dados-divergentes":"Dados divergentes","nao-consigo-acessar":"Não consigo acessar","incluir-usuario":"Incluir usuário","quero-uma-melhoria":"Quero uma melhoria","importar-cronograma":"Importar cronograma","backup-da-obra":"Backup da obra","como-gerar-relatorio":"Como gerar relatório","etiqueta-a-definir":"Etiqueta a definir","segunda-via-boleto":"Segunda via de boleto","nota-fiscal":"Nota fiscal","cobranca-duplicada":"Cobrança duplicada"};
function parseTag(t){const[mot,prod,tipo,nv]=t.split("_");return{motivo:MOT_LBL[mot]||mot.replace(/-/g," "),produto:PRODUTO[prod]||prod,tipo:tipo.charAt(0).toUpperCase()+tipo.slice(1),nivel:nv,prov:mot==="etiqueta-a-definir"}}
function regras(tags){let prio="Média",sla=null,temRegra=false;tags.forEach(t=>{const r=REGRA[t];if(!r)return;temRegra=true;if(PRIO_ORD[r.prio]<PRIO_ORD[prio]||!temRegra)prio=r.prio;if(r.sla!=null)sla=sla==null?r.sla:Math.min(sla,r.sla)});if(!temRegra)prio="Média";return{prio,sla}}
function prioDe(tags){let p=null;tags.forEach(t=>{const r=REGRA[t];if(r&&(p==null||PRIO_ORD[r.prio]<PRIO_ORD[p]))p=r.prio});return p||"Média"}
function slaDe(tags){let s=null;tags.forEach(t=>{const r=REGRA[t];if(r&&r.sla!=null)s=s==null?r.sla:Math.min(s,r.sla)});return s}
function melhorTag(tags){const ord=t=>{const p=parseTag(t);return(p.tipo==="Problema"?0:p.tipo==="Solicitação"?1:2)*10+(p.nivel==="n2"?0:1)+(p.prov?5:0)};return tags.slice().sort((a,b)=>ord(a)-ord(b))[0]}
function titulo(c){const t=c.tags.length?parseTag(melhorTag(c.tags)):null;const pre=[c.empresa,c.obra,t&&t.produto!=="Financeiro"?t.produto:null].filter(Boolean).join(" - ");
  const corpo=t&&!t.prov?`${t.tipo}/${t.motivo}`:limpaAssunto(c.assunto);return(pre?`[${pre}] `:"")+corpo}
const curto=c=>{const t=c.tags.length?parseTag(melhorTag(c.tags)):null;return t&&!t.prov?t.motivo:limpaAssunto(c.assunto)};
const limpaAssunto=s=>s.replace(/^\s*((re|res|enc|fw|fwd)\s*:\s*)+/i,"").slice(0,120);

let SEQ=13480;const CH=[];
function novoChamado(o){const c=Object.assign({id:++SEQ,status:"aberto",tags:[],assunto:"",nome:"",email:"",empresa:null,obra:null,csm:null,atendente:null,jira:[],criado:NOW0,mudou:NOW0,pausas:[],pausadoEm:null,resolvido:null,prim:null,ult:null,area:"cs",origem:null,timeline:[],fundidoEm:null},o);CH.push(c);return c}
(function gerar(){
  const plano=[["novo",3],["aberto",22],["pendente",9],["em_espera",14],["resolvido",34]];
  plano.forEach(([st,n])=>{for(let i=0;i<n;i++){
    const fin=R()<.14, tg=fin?pick(TAGS.filter(t=>t[0].includes("_financeiro_"))):pick(TAGS.filter(t=>!t[0].includes("_financeiro_")));
    const tags=[tg[0]];if(!fin&&R()<.15)tags.push(pick(TAGS.filter(t=>!t[0].includes("_financeiro_")))[0]);
    const mot=tg[0].split("_")[0], semEmp=R()<.18, e=pick(EMP), nome=pick(NOMES);
    const idadeUteis=st==="novo"?(.2+R()*1.5)*H:st==="resolvido"?(1+R()*20)*D:st==="em_espera"?(.5+R()*7)*D:(.2+R()*3.2)*D*(R()<.25?1.8:1);
    const criado=Math.min(NOW0-30*60e3,tiraUteis(NOW0,idadeUteis,SLA_H0,SLA_H1));
    const c=novoChamado({status:st,tags:[...new Set(tags)],assunto:(R()<.4?"Re: ":"")+ASSUNTO[mot],corpo:CORPO[mot],nome,email:nome.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(" ",".")+"@cliente-exemplo.com.br",
      empresa:semEmp?null:e[0],obra:semEmp||R()<.25?null:pick(e[1]),csm:semEmp?null:e[2],atendente:st==="novo"?null:(fin?ATD_FIN[0]:pick(ATD)),criado,area:fin?"fin":"cs"});
    c.ult={de:"cliente",em:criado};
    if(st!=="novo"){c.prim=somaUteis(criado,(10+R()*(R()<.2?200:50))*60e3,CM_H0,CM_H1);if(c.prim>NOW0)c.prim=NOW0-5*60e3;c.ult={de:"atendente",em:c.prim}}
    if(st==="pendente"){c.pausadoEm=Math.max(c.prim+60e3,NOW0-(R()*3+.2)*D);c.mudou=c.pausadoEm;c.ult={de:"atendente",em:c.pausadoEm}}
    if(st==="em_espera"||(st==="aberto"&&R()<.25)||(st==="resolvido"&&R()<.3)){c.jira=["OBR-"+(2100+Math.floor(R()*90))];c.jiraIni=true;c.jiraStatus=pick(["Em desenvolvimento","Em análise","Pronto para teste"])}
    if(st==="aberto"&&R()<.4){c.pausas=[{de:criado+.3*(c.prim-criado),ate:criado+.6*(c.prim-criado)+D}];c.ult={de:"cliente",em:Math.min(NOW0-20*60e3,c.pausas[0].ate)}}
    if(st==="resolvido"){c.resolvido=Math.min(NOW0-H,somaUteis(criado,(.3+R()*(R()<.25?6:2.5))*D,SLA_H0,SLA_H1));c.mudou=c.resolvido;c.ult={de:"atendente",em:c.resolvido}}
    if(R()<.12)c.origem=9000+Math.floor(R()*800);
  }});
  CH.sort((a,b)=>a.criado-b.criado).forEach((c,i)=>c.id=13480+i);SEQ=13480+CH.length;
})();

/* ========== SLA e 1ª resposta ========== */
function pausado(c,fim){let p=0;c.pausas.forEach(x=>p+=uteisEntre(x.de,Math.min(x.ate,fim),SLA_H0,SLA_H1));if(c.pausadoEm)p+=uteisEntre(c.pausadoEm,fim,SLA_H0,SLA_H1);return p}
function sla(c,agora){const dias=slaDe(c.tags);if(dias==null)return{st:"sem_sla"};
  const fim=c.resolvido||agora,lim=dias*D,dec=uteisEntre(c.criado,fim,SLA_H0,SLA_H1)-pausado(c,fim),resta=lim-dec;
  if(c.resolvido)return{st:resta>=0?"ok_fim":"late_fim",resta};
  if(c.status==="pendente")return{st:"pausado",resta};
  const vence=somaUteis(agora,Math.max(0,resta),SLA_H0,SLA_H1);
  return{st:resta>=0?"no_prazo":"atrasado",resta,vence}}
const dd=ms=>{ms=Math.abs(ms);const m=Math.round(ms/60e3);if(m<60)return Math.max(1,m)+"min";const h=Math.floor(m/60),d=Math.floor(h/24);if(d)return d+"d"+(h%24?" "+h%24+"h":"");return h+"h"+(m%60&&h<6?" "+m%60+"min":"")};
const fmt=new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",hour:"2-digit"});
const fmtF=new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",day:"2-digit",month:"2-digit",year:"numeric",hour:"2-digit",minute:"2-digit"});
const hhmm=ms=>new Intl.DateTimeFormat("pt-BR",{timeZone:"America/Sao_Paulo",hour:"2-digit",minute:"2-digit"}).format(ms);
const vence=ms=>fmt.format(ms).replace(",","")+"h";
function seloSla(c,agora){const s=sla(c,agora);
  switch(s.st){case"sem_sla":return`<span class="pl s-none">Sem SLA</span>`;
    case"no_prazo":return`<span class="pl s-ok">No prazo</span><span class="sub">vence ${vence(s.vence)} · faltam ${dd(s.resta)}</span>`;
    case"atrasado":return`<span class="pl s-late">Atrasado</span><span class="sub">há ${dd(-s.resta)}</span>`;
    case"pausado":return`<span class="pl s-pause">Pausado</span><span class="sub">aguardando cliente</span>`;
    case"ok_fim":return`<span class="pl s-ok">Concluído no prazo</span>`;
    default:return`<span class="pl s-late">Concluído com atraso</span>`}}
function primeira(c,agora){if(c.status==="novo"&&!c.prim){const dec=uteisEntre(c.criado,agora,CM_H0,CM_H1);return dec>H?`<span class="pl s-late">Atrasada</span><span class="sub">${dd(dec)} úteis</span>`:`<span class="pl s-ok">No prazo</span><span class="sub">${dd(dec)} úteis</span>`}
  if(!c.prim)return c.status==="resolvido"?`<span class="pl s-none">Sem resposta</span>`:"—";const dec=uteisEntre(c.criado,c.prim,CM_H0,CM_H1);return`<span class="pl ${dec<=H?"s-ok":"s-late"}">${dec<=H?"Respondida no prazo":"Com atraso"}</span><span class="sub">${dd(dec)} úteis</span>`}
function ordem(c,agora){const s=sla(c,agora);const g={atrasado:0,no_prazo:1,sem_sla:2,pausado:3,ok_fim:4,late_fim:4}[s.st];return[g,g===0?s.resta:g===1?s.resta:-(c.ult?c.ult.em:c.criado)]}

/* ========== Estado e filtros ========== */
const S={visao:"cs",modo:"lista",busca:"",fst:"andamento",cnt:null,pag:0,ord:"urg",dir:1,aberto:null,showRes:false};
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
const STATUS={novo:"Novo",aberto:"Aberto",pendente:"Pendente",em_espera:"Em espera",resolvido:"Resolvido"};
const daVisao=c=>c.area===S.visao&&!c.fundidoEm;
function bate(c){const q=norm(S.busca).trim();if(!q)return true;const m=q.match(/^#?(\d{4,6})$/)||q.match(/problemas\/(\d+)/);if(m)return String(c.id)===m[1];
  const alvo=norm([c.id,titulo(c),c.assunto,c.nome,c.email,c.empresa,c.obra,c.csm,c.atendente,c.jira.join(" "),c.tags.join(" ")].join(" "));return q.split(/\s+/).every(w=>alvo.includes(w))}
function cntFiltro(c,k,agora){switch(k){case"novo":case"aberto":case"pendente":case"em_espera":return c.status===k;case"atrasado":return c.status!=="resolvido"&&sla(c,agora).st==="atrasado";case"semEmp":return c.status!=="resolvido"&&!c.empresa}return true}
function lista(agora){return CH.filter(c=>daVisao(c)&&bate(c)&&(S.cnt?cntFiltro(c,S.cnt,agora):S.fst==="todos"||(S.fst==="andamento"?c.status!=="resolvido"||S.showRes:c.status===S.fst)))}

function render(){
  const agora=Date.now();

  $("#sync").innerHTML=`E-mails sincronizados às ${hhmm(agora)} <span style="color:var(--faint)">(simulação)</span> · Regras de etiqueta lidas às ${hhmm(agora)}.`;
  document.querySelectorAll("#visao button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.v===S.visao));
  document.querySelectorAll("#modo button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===S.modo));
  const V=CH.filter(daVisao);
  const C=[["novo","Novos","c-blue"],["aberto","Abertos",""],["pendente","Pendentes (aguardando cliente)","c-amber"],["em_espera","Em espera (com a TI)","c-violet"],["atrasado","Atrasadas","c-red"],["semEmp","Sem empresa","c-slate"]];

  const L=lista(agora);
  const resEsc=S.fst==="andamento"&&!S.showRes&&!S.cnt?V.filter(c=>c.status==="resolvido"&&bate(c)).length:0;
  $("#meta").innerHTML=`${L.length} de ${V.length}`+(resEsc?` <button class="lnk" id="mostraRes">${resEsc} resolvidos escondidos · mostrar</button>`:"")+(S.cnt?` <button class="lnk" id="limpa">limpar filtro</button>`:"");

const COLS=[["id","Nº"],["status","Status"],["sol","Solicitação"],["tipo","Tipo"],["empresa","Empresa"],["obra","Obra"],["nome","Solicitante"],["prio","Prioridade"],["urg","Prazo"],["prim","1ª resposta"],["ult","Última interação"],["atd","Atendente"],["csm","CSM"],["jira","Jira"]];
function chaveOrd(c,k,agora){switch(k){case"urg":return ordem(c,agora);case"prio":return PRIO_ORD[prioDe(c.tags)];case"sol":return norm(curto(c));case"tipo":return c.tags.length?parseTag(melhorTag(c.tags)).tipo:"~";case"ult":return-(c.ult?c.ult.em:0);case"atd":return c.atendente||"~";case"jira":return c.jira[0]||"~";case"prim":return c.prim?c.prim-c.criado:9e15;default:return c[k]??"~"}}
function cmp(a,b){if(Array.isArray(a)){for(let i=0;i<a.length;i++){if(a[i]!==b[i])return a[i]<b[i]?-1:1}return 0}return a<b?-1:a>b?1:0}
function renderLista(L,agora){
  const arr=L.slice().sort((a,b)=>cmp(chaveOrd(a,S.ord,agora),chaveOrd(b,S.ord,agora))*S.dir);
  const tam=25,pags=Math.max(1,Math.ceil(arr.length/tam));if(S.pag>=pags)S.pag=pags-1;const vis=arr.slice(S.pag*tam,S.pag*tam+tam);
  const pr=p=>`<span class="pl ${{Urgente:"p-urg",Alta:"p-alta","Média":"p-media",Baixa:"p-baixa"}[p]}">${p}</span>`;
  const ult=c=>c.ult?`${{cliente:"Cliente",atendente:"Atendente",sistema:"Sistema"}[c.ult.de]}<span class="sub">há ${dd(agora-c.ult.em)}</span>`:"—";
  $("#view").innerHTML=`<div class="tw"><table><thead><tr>${COLS.map(([k,l])=>`<th class="${k==="sol"?"stk c-sol":""}"><button data-o="${k}">${l}${S.ord===k?(S.dir>0?" ↑":" ↓"):""}</button></th>`).join("")}</tr></thead><tbody>`+
  (vis.length?vis.map(c=>{const t=c.tags.length?parseTag(melhorTag(c.tags)):null;return`<tr class="cl" data-id="${c.id}" tabindex="0">
    <td><span class="num">#${c.id}</span>${c.origem?`<span class="sub">da conversa #${c.origem}</span>`:""}</td><td>${STATUS[c.status]}</td>
    <td class="stk c-sol" title="${esc(titulo(c))}">${esc(curto(c))}</td><td>${t?t.tipo+`<span class="sub">${t.produto}</span>`:"—"}</td>
    <td>${c.empresa?esc(c.empresa):'<span class="warn">⚠</span> —'}</td><td>${esc(c.obra||"—")}</td><td>${esc(c.nome)}</td><td>${pr(prioDe(c.tags))}</td>
    <td>${seloSla(c,agora)}</td><td>${primeira(c,agora)}</td><td>${ult(c)}</td><td>${esc(c.atendente||"—")}</td><td>${esc(c.csm||"—")}</td><td>${c.jira.map(j=>`<span class="jira">${j}</span>`).join(" ")||"—"}</td></tr>`}).join(""):`<tr><td colspan="14" style="text-align:center;color:var(--muted);padding:30px">Nenhum chamado com esses filtros.</td></tr>`)+
  `</tbody></table></div><div class="foot"><span>Mostrando ${arr.length?S.pag*tam+1:0}–${Math.min(arr.length,S.pag*tam+tam)} de ${arr.length}</span><span class="pg"><button class="btn" data-p="-1" ${S.pag===0?"disabled":""}>‹ Anterior</button>Página ${S.pag+1} de ${pags}<button class="btn" data-p="1" ${S.pag>=pags-1?"disabled":""}>Próxima ›</button></span></div>`;
}
const KCOLS=[["novo","Novo","Acabou de chegar. Sai daqui sozinho quando alguém responde ou assume."],["aberto","Aberto","O time precisa agir."],["pendente","Pendente","Aguardando o cliente. O SLA está pausado. Quando ele responde, volta para Aberto."],["em_espera","Em espera","Com o time de TI no Jira. O SLA continua correndo."],["resolvido","Resolvido","Concluídos nos últimos 7 dias."]];

}

/* ========== Mudança de status (com as regras do sistema) ========== */
function mudaStatus(c,novo,agora=Date.now()){
  if(c.status===novo)return;
  if(c.status==="pendente"&&c.pausadoEm){c.pausas.push({de:c.pausadoEm,ate:agora});c.pausadoEm=null}
  if(novo==="pendente")c.pausadoEm=agora;
  if(novo==="resolvido")c.resolvido=agora;else c.resolvido=null;
  if(!c.atendente&&novo!=="novo")c.atendente="Você (demo)";
  c.timeline.push({t:"sys",em:agora,txt:`Status alterado de ${STATUS[c.status]} para ${STATUS[novo]}. ${novo==="em_espera"?"No CloudChat continua \"aberta\" (o Em espera existe só na Central).":"Atualizado também no CloudChat (simulação)."}`});
  c.status=novo;c.mudou=agora;toast(`#${c.id} agora está em ${STATUS[novo]}${novo==="pendente"?" · SLA pausado":""}.`);
}

function pedeResolver(c){pendRes=c;$("#dc-p").textContent=`O chamado #${c.id} vai para Resolvido aqui e no CloudChat. O cliente deixa de ver o chamado como aberto.`;$("#dlgConf").showModal()}
$("#dcNo").onclick=()=>{pendRes=null;$("#dlgConf").close();render()};
$("#dcOk").onclick=()=>{if(pendRes)mudaStatus(pendRes,"resolvido");pendRes=null;$("#dlgConf").close();render()};

/* ========== Ficha do chamado ========== */
function timelineBase(c){
  const ev=[{t:"in",em:c.criado,quem:c.nome,tag:["cc","CloudChat"],txt:`Assunto: ${c.assunto}\n\n${c.corpo}`}];
  if(c.prim)ev.push({t:"out",em:c.prim,quem:c.atendente,tag:["cc","CloudChat"],txt:`Olá, ${c.nome.split(" ")[0]}! Recebemos e já estamos verificando. Pode me mandar um print da tela?`});
  if(c.pausas.length)ev.push({t:"in",em:c.pausas[0].ate,quem:c.nome,tag:["cc","CloudChat"],txt:"Segue o print. Continua acontecendo."});
  if(c.jiraIni)ev.push({t:"int",em:(c.prim||c.criado)+2*H,quem:"Automação do Jira",tag:["jr","Jira "+c.jira[0]],txt:`Issue ${c.jira[0]} criada e vinculada. Responsável iniciou a investigação.`});
  if(c.status==="pendente")ev.push({t:"out",em:c.pausadoEm,quem:c.atendente,tag:["cc","CloudChat"],txt:"Conseguiu testar de novo depois da atualização? Fico no aguardo."});
  if(c.origem)ev.push({t:"sys",em:c.criado+60e3,txt:`Chamado aberto a partir da conversa #${c.origem} (WhatsApp).`});
  if(c.resolvido)ev.push({t:"sys",em:c.resolvido,txt:"Conversa marcada como resolvida."});
  return ev}
function abre(id){S.aberto=id;$("#sheet").classList.add("on");$("#ov").classList.add("on");$("#sheet").setAttribute("aria-hidden","false");S.aba="nota";render();setTimeout(()=>{const x=$("#sheet .x");if(x)x.focus()},50)}
function fecha(){S.aberto=null;$("#sheet").classList.remove("on");$("#ov").classList.remove("on");$("#sheet").setAttribute("aria-hidden","true")}
function renderSheet(agora){
  const c=CH.find(x=>x.id===S.aberto);if(!c)return fecha();
  const s=sla(c,agora),dias=slaDe(c.tags);
  const ev=timelineBase(c).concat(c.timeline).sort((a,b)=>a.em-b.em);
  const tagLbl={in:"",out:"",int:'<span class="tg in">Interno</span>'};
  const usadas=new Set(c.tags);
  const fundiveis=CH.filter(x=>x.id!==c.id&&daVisao(x)&&x.status!=="resolvido").slice(-8);
  $("#sheet").innerHTML=`<div class="sh-h"><div class="r1"><span class="id">#${c.id}</span>
    <select id="shSt" aria-label="Status">${Object.entries(STATUS).filter(([k])=>k!=="novo"||c.status==="novo").map(([k,l])=>`<option value="${k}" ${k===c.status?"selected":""}>${l}</option>`).join("")}</select>
    <select id="shFun" aria-label="Fundir em outro chamado"><option value="">Fundir…</option>${fundiveis.map(x=>`<option value="${x.id}">em #${x.id} · ${esc(curto(x)).slice(0,40)}</option>`).join("")}</select>
    <button class="x" id="shX" aria-label="Fechar">×</button></div>
    <div class="tt">${esc(titulo(c))}</div>
    <div class="meta"><span>${esc(c.nome)} · ${esc(c.empresa||"Sem empresa")}${c.obra?" — "+esc(c.obra):""}</span><span>Prioridade <b style="color:var(--ink)">${prioDe(c.tags)}</b></span><span>Prazo ${seloSla(c,agora).replace('<span class="sub">',' <span style="font-size:11.5px">')}</span><span>CSM <b style="color:var(--ink)">${esc(c.csm||"—")}</b></span></div></div>
  <div class="sh-b"><div class="tl-w"><div class="tl" id="tl">${ev.map(e=>e.t==="sys"?`<div class="msg sys">${esc(e.txt)} · ${fmtF.format(e.em)}</div>`:
    `<div class="msg ${e.t}"><div class="mh"><b>${esc(e.quem||"")}</b>${e.tag?`<span class="tg ${e.tag[0]}">${esc(e.tag[1])}</span>`:""}${tagLbl[e.t]||""}${e.pub?'<span class="tg ct">Ao cliente</span>':""}<span class="dt">${fmtF.format(e.em)}</span></div><div style="white-space:pre-wrap">${esc(e.txt)}</div></div>`).join("")}</div>
    <div class="cmp"><div class="tabs" role="group" aria-label="Tipo de mensagem"><button data-aba="resp" aria-pressed="${S.aba==="resp"}">Responder ao cliente</button><button data-aba="nota" aria-pressed="${S.aba==="nota"}">Nota interna</button></div>
      <textarea id="txt" placeholder="${S.aba==="nota"?"Nota interna: o cliente não vê.":"Resposta ao cliente: sai por e-mail pelo CloudChat."}" aria-label="Mensagem"></textarea>
      <div class="row"><span>${S.aba==="nota"?"Só a equipe vê"+(c.jira.length?` · também no Jira (${c.jira[0]})`:""):"Na demonstração nada é enviado de verdade."}</span><button class="btn btn-a" id="enviar">${S.aba==="nota"?"Salvar nota":"Enviar resposta"}</button></div></div></div>
  <div class="side">
    <div class="acc"><h4>Tags e prioridade</h4><p>Prioridade do chamado: <b>${prioDe(c.tags)}</b> · ${dias==null?"sem SLA":"SLA "+dias+" dia"+(dias>1?"s":"")+" úteis"}</p>
      <div style="margin-top:8px">${c.tags.map(t=>`<span class="chip">${esc(t)}<button data-rm="${esc(t)}" aria-label="Remover etiqueta">×</button></span>`).join("")||'<span class="note">Sem etiqueta: prioridade Média, sem SLA.</span>'}</div>
      <select id="addTag" aria-label="Acrescentar etiqueta"><option value="">Acrescentar tag…</option>${TAGS.filter(t=>!usadas.has(t[0])&&(c.area==="fin")===t[0].includes("_financeiro_")).map(t=>`<option value="${t[0]}">${t[0]} · ${t[1]}${t[2]?" · "+t[2]+"d":""}</option>`).join("")}</select>
      <p class="note">Com várias tags, vale a prioridade mais urgente e o menor prazo. A prioridade vai também para o CloudChat.</p></div>
    <div class="acc"><h4>Jira <span>${c.jira.length}</span></h4>${c.jira.map((j,i)=>`<div class="jc"><div class="k">${j} ${i===0?'<span class="note">principal</span>':""}</div><div class="note" style="margin-top:2px">Status: <b>${esc(c.jiraStatus||"Aberto")}</b></div><div class="tr">${["Em análise","Em desenvolvimento","Pronto para teste","Concluído"].filter(x=>x!==c.jiraStatus).map(x=>`<button data-jt="${x}">${x}</button>`).join("")}</div></div>`).join("")}
      <button class="btn" id="vincJira" style="margin-top:8px;width:100%;justify-content:center">+ Criar issue no Jira</button><p class="note">Criar ou vincular uma issue leva Novo e Aberto para Em espera.</p></div>
    <div class="acc"><h4>Solicitante</h4><p>${esc(c.nome)}<br><span class="note">${esc(c.email)}</span></p></div>
    <div class="acc"><h4>Empresa / obra</h4><p>${esc(c.empresa||"Não vinculada")}${c.obra?" — "+esc(c.obra):""}</p>${!c.empresa?'<p class="note">Sem vínculo: a sugestão vem do cadastro de contatos do solicitante.</p>':""}</div>
    <div class="acc"><h4>Conversa de origem</h4><p>${c.origem?"Conversa #"+c.origem+" (WhatsApp)":"Nenhuma vinculada"}</p></div>
  </div></div>`;
  const tl=$("#tl");tl.scrollTop=tl.scrollHeight;
}
$("#sheet").addEventListener("click",e=>{
  const c=CH.find(x=>x.id===S.aberto);if(!c)return;
  if(e.target.closest("#shX"))return fecha();
  const ab=e.target.closest("[data-aba]");if(ab){S.aba=ab.dataset.aba;return render()}
  if(e.target.closest("#enviar")){const t=$("#txt").value.trim();if(!t)return toast("Escreva a mensagem primeiro.");
    const agora=Date.now();c.timeline.push({t:S.aba==="nota"?"int":"out",pub:S.aba==="resp",em:agora,quem:"Você (demo)",tag:["cc","CloudChat"],txt:t});
    if(S.aba==="resp"){if(!c.prim)c.prim=agora;c.ult={de:"atendente",em:agora};if(c.status==="novo")mudaStatus(c,"aberto",agora)}
    toast(S.aba==="nota"?"Nota salva (simulação).":"Resposta registrada (simulação: nada foi enviado).");return render()}
  const rm=e.target.closest("[data-rm]");if(rm){c.tags=c.tags.filter(t=>t!==rm.dataset.rm);c.timeline.push({t:"sys",em:Date.now(),txt:"Etiqueta removida: "+rm.dataset.rm});toast(`Prioridade agora: ${prioDe(c.tags)}.`);return render()}
  const jt=e.target.closest("[data-jt]");if(jt){c.jiraStatus=jt.dataset.jt;c.timeline.push({t:"int",em:Date.now(),quem:"Automação do Jira",tag:["jr","Jira "+c.jira[0]],txt:`${c.jira[0]} movido para ${jt.dataset.jt}.`});return render()}
  if(e.target.closest("#vincJira")){const k="OBR-"+(2200+Math.floor(Math.random()*90));c.jira.push(k);c.jiraStatus=c.jiraStatus||"Em análise";c.timeline.push({t:"int",em:Date.now(),quem:"Automação do Jira",tag:["jr","Jira "+k],txt:`Issue ${k} criada com o campo "ID do ticket" = ${c.id}.`});if(["novo","aberto"].includes(c.status))mudaStatus(c,"em_espera");else toast(`Issue ${k} criada (simulação).`);return render()}
});
$("#sheet").addEventListener("change",e=>{
  const c=CH.find(x=>x.id===S.aberto);if(!c)return;
  if(e.target.id==="shSt"){if(e.target.value==="resolvido")return pedeResolver(c);mudaStatus(c,e.target.value);return render()}
  if(e.target.id==="addTag"&&e.target.value){const antes=prioDe(c.tags);c.tags.push(e.target.value);c.timeline.push({t:"sys",em:Date.now(),txt:"Etiqueta acrescentada: "+e.target.value});const dep=prioDe(c.tags);toast(dep!==antes?`Prioridade mudou de ${antes} para ${dep}.`:"Etiqueta acrescentada.");return render()}
  if(e.target.id==="shFun"&&e.target.value){const dest=CH.find(x=>x.id===+e.target.value);c.fundidoEm=dest.id;c.status="resolvido";c.resolvido=Date.now();if(c.jira.length)dest.jira.push(...c.jira.filter(j=>!dest.jira.includes(j)));
    dest.timeline.push({t:"int",em:Date.now(),quem:"Sistema",txt:`Chamado #${c.id} (${curto(c)}, de ${c.nome}) foi fundido neste por Você (demo).`});toast(`#${c.id} fundido em #${dest.id}.`);S.aberto=dest.id;return render()}
});

/* ========== Eventos gerais ========== */
$("#counts").addEventListener("click",e=>{const b=e.target.closest("[data-c]");if(!b)return;S.cnt=S.cnt===b.dataset.c?null:b.dataset.c;S.pag=0;render()});
$("#meta").addEventListener("click",e=>{if(e.target.id==="mostraRes"){S.showRes=true;render()}if(e.target.id==="limpa"){S.cnt=null;render()}});
$("#busca").addEventListener("input",e=>{S.busca=e.target.value;S.pag=0;render()});
$("#fstatus").addEventListener("change",e=>{S.fst=e.target.value;S.cnt=null;S.showRes=false;S.pag=0;render()});
$("#visao").addEventListener("click",e=>{const b=e.target.closest("[data-v]");if(b){S.visao=b.dataset.v;S.pag=0;render()}});
$("#modo").addEventListener("click",e=>{const b=e.target.closest("[data-m]");if(b){S.modo=b.dataset.m;render()}});
$("#atualiza").onclick=()=>{render();toast("Lista atualizada.")};
$("#view").addEventListener("click",e=>{
  const o=e.target.closest("[data-o]");if(o){const k=o.dataset.o;S.dir=S.ord===k?-S.dir:1;S.ord=k;return render()}
  const p=e.target.closest("[data-p]");if(p){S.pag+=+p.dataset.p;return render()}
  const r=e.target.closest("[data-id]");if(r)abre(+r.dataset.id)});
$("#view").addEventListener("keydown",e=>{if(e.key==="Enter"){const r=e.target.closest("tr[data-id]");if(r)abre(+r.dataset.id)}});
let arrastando=null;
$("#view").addEventListener("dragstart",e=>{const k=e.target.closest(".kc");if(!k)return;arrastando=+k.dataset.id;k.classList.add("drag");e.dataTransfer.effectAllowed="move";e.dataTransfer.setData("text/plain",k.dataset.id)});
$("#view").addEventListener("dragend",e=>{const k=e.target.closest(".kc");if(k)k.classList.remove("drag");document.querySelectorAll(".col.over").forEach(x=>x.classList.remove("over"))});
$("#view").addEventListener("dragover",e=>{const col=e.target.closest(".col");if(!col||col.dataset.col==="novo")return;e.preventDefault();document.querySelectorAll(".col.over").forEach(x=>x!==col&&x.classList.remove("over"));col.classList.add("over")});
$("#view").addEventListener("drop",e=>{const col=e.target.closest(".col");if(!col)return;e.preventDefault();col.classList.remove("over");const c=CH.find(x=>x.id===arrastando);arrastando=null;if(!c||c.status===col.dataset.col)return;
  if(col.dataset.col==="resolvido")return pedeResolver(c);mudaStatus(c,col.dataset.col);render()});
$("#ov").onclick=fecha;document.addEventListener("keydown",e=>{if(e.key==="Escape"&&S.aberto&&!document.querySelector("dialog[open]"))fecha()});

/* Novo chamado */
$("#nEmp").innerHTML=`<option value="">Não vinculada</option>`+EMP.map(e=>`<option>${e[0]}</option>`).join("");
$("#novo").onclick=()=>{$("#nTag").innerHTML=`<option value="">Sugerir depois</option>`+TAGS.filter(t=>(S.visao==="fin")===t[0].includes("_financeiro_")).map(t=>`<option value="${t[0]}">${t[0]}</option>`).join("");$("#dlgNovo").showModal()};
$("#formNovo").addEventListener("submit",e=>{
  if(e.submitter&&e.submitter.value!=="ok")return;const f=new FormData(e.target);const emp=EMP.find(x=>x[0]===f.get("empresa"));const agora=Date.now();
  const c=novoChamado({id:++SEQ,status:"novo",tags:f.get("tag")?[f.get("tag")]:[],assunto:String(f.get("assunto")),corpo:"(aberto pela equipe)",nome:String(f.get("nome")||f.get("email")),email:String(f.get("email")),empresa:emp?emp[0]:null,obra:emp?emp[1][0]:null,csm:emp?emp[2]:null,criado:agora,area:S.visao});
  c.ult={de:"sistema",em:agora};c.timeline.push({t:"int",em:agora+1000,quem:"Você (demo)",txt:String(f.get("texto")||"")+"\n\nAberto pela equipe. Nada foi enviado ao cliente."});
  S.cnt=null;S.fst="andamento";S.busca="";$("#busca").value="";render();toast(`Chamado #${c.id} criado como Novo.`);abre(c.id)});

let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),2600)}
render();setInterval(()=>{if(!S.aberto&&!document.querySelector("dialog[open]"))render()},60000);
</script>
</body>
</html>
