<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Fit Pepe by Alan</title>
<meta name="robots" content="noindex" />
<meta name="description" content="Diário de treino, macros e progresso corporal" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Fit Pepe by Alan" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="theme-color" content="#EDEEEA" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icon-180.png" />
<link rel="icon" href="icon-192.png" />
<script src="https://cdn.tailwindcss.com"></script>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react-dom/client": "https://esm.sh/react-dom@18.2.0/client"
  }
}
</script>
<style>
  html, body { margin: 0; padding: 0; background: #EDEEEA; }
  #root { min-height: 100vh; }
</style>
</head>
<body>
<div id="root"></div>
<script>
  window.storage = {
    async get(key) {
      try {
        const v = localStorage.getItem(key);
        return v == null ? null : { key, value: v, shared: false };
      } catch (e) { return null; }
    },
    async set(key, value) {
      try {
        localStorage.setItem(key, value);
        return { key, value, shared: false };
      } catch (e) { return null; }
    },
    async delete(key) {
      try {
        const existed = localStorage.getItem(key) != null;
        localStorage.removeItem(key);
        return { key, deleted: existed, shared: false };
      } catch (e) { return null; }
    },
    async list(prefix) {
      try {
        const keys = [];
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!prefix || (k && k.startsWith(prefix))) keys.push(k);
        }
        return { keys, prefix, shared: false };
      } catch (e) { return null; }
    },
  };

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
<script type="module" src="main.js"></script>
</body>
</html>
