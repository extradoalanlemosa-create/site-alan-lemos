<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Indicadores · demonstração com dados fictícios</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --font:'Manrope','Segoe UI',system-ui,-apple-system,'Helvetica Neue',Arial,sans-serif;
  --ink:#10111A; --ink-2:#3B3D4A; --muted:#62667A; --faint:#9A9CAA;
  --bg:#F7F6FA; --surface:#FFFFFF; --line:#DDDDE6; --line-soft:#ECEBF2; --pill:#EEEDF5; --hover:#F3F2F8;
  --accent:#FF6028; --accent-strong:#D9480F; --accent-tint:#FDEBE4;
  --red-bg:#FEF2F2; --red-line:#F7D0D0; --red-ink:#C2262B;
  --amber-bg:#FFFBEB; --amber-line:#F1E0AE; --amber-ink:#8A5106;
  --green-bg:#ECFDF5; --green-line:#BFE8D7; --green-ink:#047857;
  --n1:#2a78d6; --n2:#eb6834; --sem:#C9C9D6; --ar-atend:#1baf7a; --ar-fin:#6250d6;
  --shadow:0 1px 2px rgba(16,17,26,.08); --scrim:rgba(16,17,26,.45);
}
html,body{min-height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
select,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.page{max-width:1240px;margin:0 auto;padding:24px 28px 40px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:16px}
.ttl{display:flex;gap:12px;align-items:center}
.ttl .ic{width:38px;height:38px;border-radius:8px;background:var(--accent-tint);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.ttl h1{font-size:22px;font-weight:800;letter-spacing:.01em;line-height:1.1}
.ttl p{font-size:12.5px;color:var(--muted)}
.outbtn{display:inline-flex;align-items:center;gap:6px;background:var(--pill);border-radius:6px;padding:7px 12px;font-size:13px;color:var(--ink-2);white-space:nowrap;text-decoration:none}
.outbtn:hover{background:var(--line-soft)}

.tabs{display:inline-flex;gap:2px;background:var(--pill);border-radius:6px;padding:4px;margin-bottom:16px;max-width:100%;overflow-x:auto}
.tabs button{padding:6px 12px;border-radius:4px;font-size:14px;color:var(--ink-2);white-space:nowrap}
.tabs button:hover{color:var(--ink)}
.tabs button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px}
.filters{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line);border-radius:8px 8px 0 0;padding:14px 26px;display:flex;flex-wrap:wrap;gap:12px 14px;align-items:flex-end}
.fg{display:flex;flex-direction:column;gap:4px}
.fg>span{font-size:11.5px;color:var(--muted)}
.fg select,.fg input{height:32px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:0 8px;font-size:13px;min-width:110px;max-width:170px}
.seg{display:inline-flex;background:var(--pill);border-radius:6px;padding:3px;gap:1px}
.seg button{padding:4px 9px;border-radius:4px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--shadow)}
.f-end{margin-left:auto;display:flex;align-items:center;gap:10px}
.stamp{font-size:12px;color:var(--muted);white-space:nowrap}
.refresh{width:34px;height:32px;border:1px solid var(--line);border-radius:6px;display:flex;align-items:center;justify-content:center;color:var(--ink-2)}
.refresh:hover{background:var(--hover)}

.content{padding:26px 26px 30px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.sec-h h2{font-size:23px;font-weight:700;letter-spacing:-.005em}
.sec-h p{font-size:13px;color:var(--muted);max-width:62ch;margin-top:2px}
.badge-ok{font-size:11.5px;color:var(--green-ink);background:var(--green-bg);border:1px solid var(--green-line);padding:2px 10px;border-radius:20px;white-space:nowrap}

.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px;margin-bottom:16px}
.kpi{border:1px solid var(--line);border-radius:8px;padding:13px 14px;text-align:left;background:var(--surface);display:flex;flex-direction:column;justify-content:center;min-width:0}
button.kpi:hover{border-color:var(--faint);background:var(--hover)}
.kpi .l{font-size:10.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.kpi .v{font-size:23px;font-weight:800;line-height:1.25;margin:2px 0}
.kpi .v.red{color:var(--red-ink)}
.kpi .s{font-size:11.5px;color:var(--muted);line-height:1.35}

.card{border:1px solid var(--line);border-radius:8px;padding:16px 18px 18px;margin-bottom:16px;background:var(--surface);min-width:0}
.card h3{font-size:16px;font-weight:700}
.card .d{font-size:12.5px;color:var(--muted);margin:2px 0 12px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
.g2>.card{margin-bottom:0}
.lg{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--ink-2);margin-bottom:8px}
.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}

.chart{position:relative;width:100%}
.chart svg{display:block;width:100%;overflow:visible}
.ax{font-size:11px;fill:var(--muted);font-family:var(--font)}
.hit{fill:transparent;cursor:pointer}
.hit:hover{fill:rgba(16,17,26,.04)}

.hb{display:grid;grid-template-columns:minmax(120px,38%) 1fr 64px;gap:10px;align-items:center;padding:5px 6px;border-radius:4px;width:100%;text-align:left}
.hb:hover{background:var(--hover)}
.hb .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:13px;color:var(--ink-2)}
.trk{height:10px;background:var(--line-soft);border-radius:2px;display:flex;overflow:hidden;gap:1px}
.trk span{height:100%}
.hb .n{text-align:right;font-size:12.5px;color:var(--ink-2);white-space:nowrap}
.hb.wide{grid-template-columns:60px 1fr 96px}

.areabar{margin-bottom:14px}
.areabar .h{display:flex;justify-content:space-between;gap:8px;font-size:13px;margin-bottom:5px}
.areabar .h b{font-weight:700}
.areabar .h span{color:var(--ink-2);font-size:12.5px;text-align:right}
.areabar .b{display:flex;gap:2px;height:22px;width:100%}
.areabar .b button{color:#fff;font-size:11.5px;font-weight:600;text-align:left;padding:0 8px;white-space:nowrap;overflow:hidden;border-radius:2px}
.note{font-size:12px;color:var(--muted)}
.chip{display:inline-block;font-size:11px;background:var(--pill);border-radius:4px;padding:0 5px;color:var(--ink-2)}

.dims{display:inline-flex;flex-wrap:wrap;gap:1px;background:var(--pill);border-radius:6px;padding:3px;margin-bottom:10px;max-width:100%}
.dims button{padding:4px 10px;border-radius:4px;font-size:13px;color:var(--ink-2);white-space:nowrap}
.dims button[aria-pressed="true"]{background:#fff;color:var(--ink);font-weight:600;box-shadow:var(--shadow)}

.sx{overflow-x:auto;-webkit-overflow-scrolling:touch}
table.tb{width:100%;border-collapse:collapse;font-size:13px}
.tb th{font-weight:500;color:var(--ink-2);font-size:12px;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tb th.r,.tb td.r{text-align:right}
.tb th button{font-weight:500;color:inherit;font-size:12px}
.tb td{padding:9px 10px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
.tb tr.cl{cursor:pointer}
.tb tr.cl:hover td{background:var(--hover)}
.tb small{display:block;font-size:10.5px;color:var(--faint)}
.num{font-weight:700;color:var(--accent-strong);white-space:nowrap}
.pl{display:inline-block;font-size:11.5px;background:var(--pill);color:var(--ink-2);border-radius:20px;padding:1px 9px;white-space:nowrap}
.pl.ia{background:#E7F0FC;color:#1c5cab}
.pl.h{background:var(--accent-tint);color:var(--accent-strong)}
.circ{display:inline-flex;align-items:center;justify-content:center;min-width:20px;height:20px;border-radius:50%;background:var(--red-bg);border:1px solid var(--red-line);color:var(--red-ink);font-size:11px;padding:0 5px}
.btn-o{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:6px 12px;font-size:13px;background:#fff;white-space:nowrap}
.btn-o:hover{background:var(--hover)}
.rowh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;gap:10px}

.rules{max-width:76ch}
.rules h3{font-size:15px;font-weight:700;margin:20px 0 4px}
.rules h3:first-child{margin-top:0}
.rules p,.rules li{font-size:13.5px;color:var(--ink-2)}
.rules ul{padding-left:18px;display:flex;flex-direction:column;gap:3px}
.empty{padding:22px;text-align:center;color:var(--muted);font-size:13px}

#tip{position:fixed;z-index:90;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:6px;max-width:250px;opacity:0;transition:opacity .08s}
#tip.on{opacity:1}
#tip .k{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}

.ov{position:fixed;inset:0;background:var(--scrim);z-index:40;display:none}
.ov.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(900px,100vw);background:var(--surface);z-index:50;transform:translateX(100%);transition:transform .2s ease;display:flex;flex-direction:column}
.drawer.on{transform:none}
.dh{padding:18px 20px 14px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:12px}
.dh h2{font-size:17px;font-weight:700}
.dh p{font-size:12.5px;color:var(--muted)}
.db{overflow:auto;flex:1;padding:6px 10px 20px}
.x{font-size:22px;line-height:1;padding:2px 8px;border-radius:6px;color:var(--muted);align-self:flex-start}
.x:hover{background:var(--hover)}
dialog{margin:auto;border:0;border-radius:10px;padding:0;width:min(640px,calc(100vw - 24px));max-height:calc(100vh - 40px);color:var(--ink);font-family:var(--font)}
dialog::backdrop{background:var(--scrim)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px 16px;margin-bottom:16px}
.facts div{font-size:11.5px;color:var(--muted)}
.facts b{display:block;font-size:13.5px;font-weight:600;color:var(--ink)}
.tl{list-style:none;display:flex;flex-direction:column;gap:10px}
.tl li{font-size:13px;max-width:86%;padding:8px 11px;border-radius:8px;background:var(--pill)}
.tl li.me{align-self:flex-end;background:var(--accent-tint)}
.tl li.ia{align-self:flex-end;background:#E7F0FC}
.tl li.nt{align-self:center;background:var(--amber-bg);border:1px solid var(--amber-line);font-size:12.5px;max-width:100%}
.tl li.sy{align-self:center;background:none;color:var(--muted);font-size:12px;padding:2px}
.tl .m{display:block;font-size:11px;color:var(--faint);margin-bottom:2px}

@media (max-width:900px){.g2{grid-template-columns:1fr}}
@media (max-width:640px){
  .page{padding:16px 12px 32px}
  .top .outbtn{display:none}
  .filters{position:static;padding:12px 14px}
  .fg select,.fg input{min-width:0;max-width:none;width:100%}
  .fg{flex:1 1 40%}
  .fg.per{flex-basis:100%}
  .seg{flex-wrap:wrap}
  .f-end{margin-left:0;width:100%;justify-content:space-between}
  .content{padding:18px 14px 22px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .facts{grid-template-columns:repeat(2,1fr)}
  .hb{grid-template-columns:minmax(90px,38%) 1fr 54px}
  .dims{flex-wrap:nowrap;overflow-x:auto}
}
@media (prefers-reduced-motion:reduce){.drawer{transition:none}}
</style>
</head>

<script>
"use strict";
/* ============ Dados fictícios, gerados no navegador ============ */
const H=3600e3, D=24*H, OFF=3*H; // Brasília = UTC-3
const FERIADOS=new Set(["2025-11-20","2025-12-25","2026-01-01","2026-04-03","2026-04-21","2026-05-01","2026-06-04","2026-09-07","2026-10-12","2026-11-02","2026-11-15","2026-11-20","2026-12-25"]);
const NOW=Date.now();
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const R=rng(20261120);
const pick=a=>a[Math.floor(R()*a.length)];
function wpick(p){const s=p.reduce((a,x)=>a+x[1],0);let r=R()*s;for(const x of p){r-=x[1];if(r<=0)return x[0]}return p[p.length-1][0]}
function lognorm(med,sp){const u=Math.max(1e-9,R()),v=R();return med*Math.exp(sp*Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v))}
const bp=ms=>{const d=new Date(ms-OFF);return{y:d.getUTCFullYear(),m:d.getUTCMonth(),d:d.getUTCDate()}};
const iso=(y,m,d)=>new Date(Date.UTC(y,m,d)).toISOString().slice(0,10);
const diaDe=ms=>{const p=bp(ms);return iso(p.y,p.m,p.d)};
const util=(y,m,d)=>{const w=new Date(Date.UTC(y,m,d)).getUTCDay();return w>=1&&w<=5&&!FERIADOS.has(iso(y,m,d))};
const jan=(y,m,d)=>[Date.UTC(y,m,d,8)+OFF,Date.UTC(y,m,d,18)+OFF];
function uteis(a,b){if(!(b>a))return 0;let t=0;const p=bp(a);let c=Date.UTC(p.y,p.m,p.d);
  for(let i=0;i<400;i++){const x=new Date(c),y=x.getUTCFullYear(),m=x.getUTCMonth(),d=x.getUTCDate();const[ws,we]=jan(y,m,d);if(ws>b)break;
    if(util(y,m,d)){const s=Math.max(a,ws),e=Math.min(b,we);if(e>s)t+=e-s}c+=D}return t/1000}
function maisUteis(t,s){let l=s*1000;const p=bp(t);let c=Date.UTC(p.y,p.m,p.d);
  for(let i=0;i<400;i++){const x=new Date(c),y=x.getUTCFullYear(),m=x.getUTCMonth(),d=x.getUTCDate();
    if(util(y,m,d)){const[ws,we]=jan(y,m,d);const s0=Math.max(t,ws);if(we>s0){const av=we-s0;if(av>=l)return s0+l;l-=av}}c+=D}return t+s*1000}
function menosUteis(t,s){let l=s*1000;const p=bp(t);let c=Date.UTC(p.y,p.m,p.d);
  for(let i=0;i<400;i++){const x=new Date(c),y=x.getUTCFullYear(),m=x.getUTCMonth(),d=x.getUTCDate();
    if(util(y,m,d)){const[ws,we]=jan(y,m,d);const e0=Math.min(t,we);if(e0>ws){const av=e0-ws;if(av>=l)return e0-l;l-=av}}c-=D}return t-s*1000}

const EMPRESAS=[["Alfa Construtora",["Residencial Norte","Torre Sul","Parque das Águas"],"Carla Dias",18],["Beta Engenharia",["Edifício Aurora","Residencial Jardins"],"Dora Reis",14],["Gama Incorporadora",["Torre Atlântica"],"Carla Dias",11],["Delta Obras",["Condomínio Serra","Vila Mar"],"Eduardo Nunes",9],["Épsilon Construções",["Residencial Bosque"],"Dora Reis",8],["Horizonte Engenharia",["Centro Empresarial Leste","Residencial Horizonte"],"Eduardo Nunes",7],["Pedra Alta Construtora",["Pedra Alta Home"],"Carla Dias",6],["Vale Verde Incorporações",["Vale Verde I","Vale Verde II"],"Dora Reis",5],["Marco Zero Obras",["Marco Zero Prime"],"Eduardo Nunes",4],["Zeta Empreendimentos",["Zeta Office"],"Carla Dias",3]];
const NOMES=["Marina Teixeira","Paulo Ramos","Helena Prado","Rui Alves","Lia Moraes","Teo Barros","Sofia Campos","Igor Matos","Beatriz Lopes","Caio Fontes","Renata Vidal","Otávio Reis","Lucas Peixoto","Aline Duarte","Mateus Rocha","Patrícia Gomes","Vítor Sales","Camila Nery","Diego Brito","Larissa Mota","Júlio Farias","Nina Albuquerque"];
const SUPORTE=["Ana Souza","Bruno Lima","Fernanda Melo"], IMPLANT=["Gustavo Pires"], FIN=["Júlia Castro","Rafael Antunes"];
const MOT_CS=[["Acesso ao aplicativo","Dúvida",16,.86,"não consigo entrar no aplicativo, diz que a senha está errada"],["Como gerar relatório","Dúvida",14,.80,"como eu gero o relatório semanal da obra?"],["Cadastro de usuário","Solicitação",10,.70,"preciso cadastrar um novo engenheiro na obra"],["Alterar permissões","Solicitação",7,.55,"quero que o mestre de obras veja só o planejamento"],["Relatório não abre","Problema",9,.30,"o relatório fica carregando e não abre"],["Erro ao salvar planejamento","Problema",8,.22,"dá erro quando salvo o planejamento da semana"],["Lentidão no aplicativo","Problema",6,.35,"o aplicativo está muito lento hoje"],["Importar cronograma","Dúvida",6,.72,"como importo o cronograma do MS Project?"],["Medição divergente","Problema",5,.25,"a medição do mês não bate com o que lançamos"],[null,"Sem classificação",5,.60,"oi, podem me ajudar?"]];
const MOT_FIN=[["Segunda via de boleto","Solicitação",14,.82,"preciso da segunda via do boleto deste mês"],["Nota fiscal","Solicitação",10,.70,"não recebi a nota fiscal de outubro"],["Dúvida sobre contrato","Dúvida",6,.40,"quando vence a renovação do nosso contrato?"],["Pagamento em duplicidade","Problema",3,.10,"o pagamento foi cobrado duas vezes"]];
const PRODUTOS=[["Planejamento",45],["Medição",33],["Qualidade",22]];
const RESP_IA={"Acesso ao aplicativo":"Vamos resolver: toque em \"Esqueci minha senha\" na tela de entrada e use o e-mail do convite. O link chega em até 2 minutos.","Como gerar relatório":"Em Relatórios › Semanal, escolha a obra e o período e toque em Gerar. O PDF fica disponível para baixar.","Segunda via de boleto":"Aqui está a segunda via do boleto deste mês. Ela vale até a data de vencimento.","_":"Entendi. Vou verificar isso com você."};

const CH=[];
(function gerar(){
  const h0=bp(NOW), base=Date.UTC(h0.y,h0.m,h0.d);
  for(let k=179;k>=0;k--){
    const day=base-k*D, x=new Date(day), y=x.getUTCFullYear(), m=x.getUTCMonth(), d=x.getUTCDate(), ev=(179-k)/179;
    const n=util(y,m,d)?Math.round(10+4*ev+R()*6):Math.round(R()*3);
    for(let j=0;j<n;j++){
      const fora=R()<.18, hr=fora?wpick([[6,1],[7,2],[19,3],[20,2],[21,1],[22,1]]):8+Math.floor(R()*10);
      const created=Date.UTC(y,m,d,hr,Math.floor(R()*60),Math.floor(R()*60))+OFF;

function passo(v){if(v<=1)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return(f<=1?1:f<=1.25?1.25:f<=2.5?2.5:f<=5?5:10)*p}

  `<div class="kpis">${kpi("Conversas",num(A.total),"no período",{k:"tot"})}${kpi("1ª resposta humana",dur(A.tprHum),"mediana, horário comercial")}${kpi("Resolução pela equipe",dur(A.resolH),"mediana, horário comercial, a partir da transferência")}</div><div class="card" id="c1"></div>`;
  const fm=new Map(),sr=new Map();F.forEach(t=>{const k=chave(t,dim);fm.set(k,(fm.get(k)||0)+1);if(t.semResp)sr.set(k,(sr.get(k)||0)+1)});
  tabela($("#c1"),[[nome,r=>`<b>${esc(r.k)}</b>${r.k==="ClaudIA"?' <span class="pl ia">IA</span>':""}`],["Conversas ↓",r=>num(r.total),"r"],["Na fila agora",r=>num(fm.get(r.k)||0),"r"],["Resolvidos",r=>num(r.resolv),"r"],
    ["CSAT",r=>r.csat==null?"—":`${NF2.format(r.csat)}<small>${num(r.csatN)} aval.</small>`,"r"],["1ª resposta humana",r=>dur(r.tprHum),"r"],["Resolução (humana)",r=>dur(r.resolH),"r"],["Sem resposta",r=>sr.get(r.k)?`<span class="circ">${sr.get(r.k)}</span>`:"0","r"]],
    grupos(L,dim).sort((a,b)=>b.total-a.total),r=>abreLista(nome+": "+r.k,r.lista));
  el.querySelector(".sec-h .seg").onclick=e=>{const b=e.target.closest("[data-eq]");if(b){S.eq=b.dataset.eq;render()}};
  liga(el,{tot:()=>abreLista("Conversas do período",L)});
}
function pgTempoReal(el){
  const F=filaAgora().map(t=>Object.assign(t,{esp:espera(t)})).sort((a,b)=>b.esp-a.esp),SR=F.filter(t=>t.semResp);
  const mx=F.length?F[0].esp:0,me=avg(F.map(t=>t.esp));
  el.innerHTML=sec("Tempo real","O que está aberto agora, por equipe e por responsável. Esta página ignora o período e se atualiza sozinha a cada minuto.",`<span class="badge-ok">Atualizado às ${hms(Date.now())}</span>`)+
  `<div class="kpis">${kpi("Na fila agora",num(F.length),"abertos ou pendentes",{k:"fila"})}${kpi("Cliente sem resposta",num(SR.length),"última mensagem tem pergunta",{k:"sr",red:SR.length>0})}${kpi("Espera média",dur(me),"horário comercial")}${kpi("Maior espera",dur(mx),"horário comercial",{red:mx>36000})}</div>
  <div class="g2"><div class="card"><h3>Fila por caixa de entrada</h3><p class="d">Conversas abertas, cada cliente conta uma vez.</p><div id="c1"></div></div><div class="card"><h3>Fila por responsável</h3><p class="d">Quem está com cada conversa aberta.</p><div id="c2"></div></div></div>
  <div class="card"><div class="rowh"><div><h3>Chamados na fila</h3><p class="d" style="margin-bottom:0">Quem espera há mais tempo aparece primeiro.</p></div><button class="btn-o" id="csv"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>Exportar CSV</button></div><p class="note" style="margin:6px 0"><b>${num(F.length)}</b> chamados</p><div id="c3"></div></div>`;
  const grp=dim=>{const m=new Map();F.forEach(t=>{const k=chave(t,dim);if(!m.has(k))m.set(k,[]);m.get(k).push(t)});return[...m].map(([k,l])=>({k,l,cli:new Set(l.map(t=>t.contato)).size,sr:l.filter(t=>t.semResp).length,em:avg(l.map(t=>t.esp)),mx:Math.max(...l.map(t=>t.esp))})).sort((a,b)=>b.l.length-a.l.length)};
  const badge=n=>n?`<span class="circ">${n}</span>`:"0";
  tabela($("#c1"),[["Caixa de entrada",r=>`<b>${esc(r.k)}</b>`],["Clientes em conversa ↓",r=>num(r.cli),"r"],["Clientes sem resposta",r=>badge(r.sr),"r"],["Espera média",r=>dur(r.em),"r"]],grp("caixa"),r=>abreLista("Fila: "+r.k,r.l,"Agora"));
  tabela($("#c2"),[["Responsável",r=>`<b>${esc(r.k)}</b>`],["Na fila ↓",r=>num(r.l.length),"r"],["Sem resposta",r=>badge(r.sr),"r"],["Espera média",r=>dur(r.em),"r"],["Maior espera",r=>dur(r.mx),"r"]],grp("atendente"),r=>abreLista("Fila: "+r.k,r.l,"Agora"));
  tabela($("#c3"),[["Chamado",t=>`<span class="num">#${t.id}</span>`],["Aguardando há ↑",t=>`<b>${dur(t.esp)}</b>`,"r"],["Situação",t=>t.status==="pendente"?'<span class="pl">Pendente</span>':'<span class="pl">Aberta</span>'],["Nível",nv],["Área",t=>t.area],["Tipo",t=>esc(t.tipo)],["Organização",t=>esc(t.empresa||"—")],["Contato",t=>esc(t.contato)],["Equipe",t=>esc(t.equipe)],["Responsável",t=>esc(t.atendente)]],F,t=>abreChamado(t.id));
  $("#csv").onclick=()=>{const rows=[["Chamado","Aguardando (horas úteis)","Situação","Área","Tipo","Organização","Contato","Equipe","Responsável"]].concat(F.map(t=>[t.id,NF1.format(t.esp/3600),t.status==="pendente"?"Pendente":"Aberta",t.area,t.tipo,t.empresa||"",t.contato,t.equipe,t.atendente]));
    const blob=new Blob(["﻿"+rows.map(r=>r.map(c=>`"${String(c).replace(/"/g,'""')}"`).join(";")).join("\n")],{type:"text/csv;charset=utf-8"});const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="fila-ficticia.csv";a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
  liga(el,{fila:()=>abreLista("Na fila agora",F,"Agora"),sr:()=>abreLista("Clientes sem resposta",SR,"Agora")});
}
function pgRegras(el){
  el.innerHTML=sec("Regras de cálculo","Como cada número desta página é calculado.")+`<div class="rules">
  <h3>Quais conversas entram</h3><p>Conversas de WhatsApp, chat do site e e-mail que o cliente começou ou que passaram pela ClaudIA. Campanhas e mensagens enviadas só pela equipe ficam de fora. A área Comercial e os contatos internos não entram nos números. A conversa entra no período pela data em que foi aberta, no horário de Brasília.</p>
  <h3>Nível e retenção</h3><p>Quando termina, a ClaudIA deixa uma nota interna dizendo se resolveu (N1) ou se passou para uma pessoa (N2). Conversa que não passou por ela fica "Sem nível". Retenção = N1 ÷ (N1 + N2).</p>
  <h3>Tempos</h3><ul><li><b>1ª resposta da ClaudIA:</b> da primeira mensagem do cliente até a resposta da IA, em tempo corrido.</li><li><b>1ª resposta humana:</b> da transferência (ou da abertura, quando não passou pela IA) até a primeira mensagem de uma pessoa, em horas úteis.</li><li><b>Resolução:</b> da transferência até a conversa ser marcada como resolvida, em horas úteis.</li><li>Horário comercial: segunda a sexta, das 8h às 18h, sem feriados. Todos os tempos usam a <b>mediana</b>, para que poucas conversas longas não distorçam o número.</li></ul>
  <h3>Satisfação (CSAT)</h3><p>Nota de 1 a 5. Positivas são 4 e 5; negativas, 1 e 2. A nota fica com quem estava com a conversa quando o cliente respondeu.</p>
  <h3>Fila e tempo real</h3><p>Entram os chamados abertos ou pendentes. "Sem resposta" é quando a última mensagem é do cliente e tem pergunta. A espera conta só em horário comercial. Acima de 10 horas úteis, o número fica em vermelho.</p>
  <h3>Organização, obra e CSM</h3><p>Vêm do cruzamento do contato com a base de clientes. Quando o contato tem uma só obra, ela aparece; quando tem várias, aparece "Várias obras". O CSM é o responsável pela maioria das obras do contato.</p>
  <h3>Sobre esta demonstração</h3><p>No sistema real, todo cálculo mora no banco de dados e a página só desenha, por isso o mesmo filtro dá o mesmo número em todo lugar. Aqui, os mesmos cálculos rodam no navegador sobre ${num(CH.length)} chamados inventados. Nenhum dado real é usado.</p></div>`;
}
const PG={visao:pgVisao,claudia:pgClaudia,volume:pgVolume,satisfacao:pgSatisfacao,equipe:pgEquipe,"tempo-real":pgTempoReal,regras:pgRegras};
function render(){const r=rota();tipOff();montaTopo();PG[r]($("#page"));document.title=AREAS.find(a=>a[0]===r)[1]+" · Indicadores (demonstração)"}
window.addEventListener("hashchange",()=>{fecha();render();window.scrollTo(0,0)});
let rt,lw=innerWidth;window.addEventListener("resize",()=>{if(innerWidth===lw)return;lw=innerWidth;clearTimeout(rt);rt=setTimeout(render,150)});
setInterval(()=>{if(rota()==="tempo-real"&&!$("#drawer").classList.contains("on")&&!$("#dlg").open)render()},60000);
render();
</script>
